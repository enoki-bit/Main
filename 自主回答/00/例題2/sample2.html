<!DOCTYPE html>
<html>
    <head>
        <title>タイトル｜htmlの勉強</title>
    </head>

    <body>
        
        <header>
            <h1 style="color: red;">h1を使った表題</h1>     <!-- HTMLはそもそも文字を書いたりするものなので、無駄にfontなどのワードを入れなくてもよい -->
            <h2 style="background-color: blue;">h2を使った表題</h2> <!--背景色はbackground-color-->
            <h3>h3を使った表題</h3>
        </header>
        <section>
            <p><a href="https://www.google.com">ブロック要素は縦に並ぶ</a></p>  <!--URLでリンクを張りたい時はaタグを使う。<a href="URL">文章<a>という形-->
                                                                            　<!-- <a href="URL"> 文字列 <a> ←この形で覚える！-->
            <div id="bloc1">    <!-- idやtypeなどは属性になる。ほかにも色々ある -->
                <span><strong>ブロック要素の中にインライン要素を入れる</strong></span>
                <span>インライン要素は横に並ぶ</span>
            </div>
            <div>
                <p>ブロック要素の中にブロック要素を入れる</p>
            </div>
        </section>
        
    </body>
</html>

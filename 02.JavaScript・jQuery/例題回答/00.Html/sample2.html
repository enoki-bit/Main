<!DOCTYPE html>
<html>
    <head>
        <title>タイトル | htmlの勉強</title>
    </head>

    <body>

        <header>
            <h1 style="color: red;">h1を使った表題</h1>
            <h2 style="background-color: blue;">h2を使った表題</h2>
            <h3>h3を使った表題</h3>
        </header>
        <section>
            <p><a href="https://www.google.com" target="_blank">ブロック要素は縦に並ぶ</a></p>
            <div id="div_1">
                <span><strong>ブロック要素の中にインライン要素を入れる</strong></span>
                <span>インライン要素は横に並ぶ</span>
            </div>
            <div id="div_2">
                <p>ブロック要素の中にブロック要素を入れる</p>
            </div>
        </section>

    </body>
</html>

<!DOCTYPE html>

<html>

    <head>
        <meta charset="UTF-8">
        <title>JavaScript APIと非同期処理の勉強</title>
        <link rel = "stylesheet" href = "style.css">
        <script src="script-q3.js"></script>
    </head>

    <body>

        <div id="frm">
            <div id="frm_title">
                <h4>鹿児島市の今の天気を表示</h4>
            </div>
            <div id="frm_body">
                <div class="body_row">
                    <p>↓下のボタンを押すと、鹿児島市の今の天気が表示されるぞ！</p>
                </div>
                <div class="body_row">
                    <button type="button" id="btn">ここを押すんだ～</button>
                </div>
                <div class="body_row">
                    <label>緯度</label>
                    <input type="text" id="latitude"></input>
                    <label>経度</label>
                    <input type="text" id="longitude"></input>
                </div>
                <div class="body_row flex">
                    <label>現在の天気</label>
                    <span id="current_weather"></span>
                </div>
            </div>
        </div>

    </body>

</html>

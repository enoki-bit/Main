<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本検索サイト</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
  </head>

  <body>
    <div class="container">
      <header class="page-header">
        <h1>本検索サイト</h1>
        <p class="guide">本のタイトルを入力して検索してください</p>
      </header>

      <section class="search-card">
        <h2 class="section-title">検索</h2>
        <div class="search-area">
          <input type="text" id="keyword" placeholder="例：となりのトトロ">
          <button id="searchButton">検索</button>
        </div>
        <p id="message"></p>
      </section>

      <section class="content-area">
        <div class="list-area">
          <h2 class="section-title">検索結果</h2>
          <ul id="result"></ul>
        </div>

        <div class="detail-area">
          <h2 class="section-title">本の詳細</h2>
          <div id="detail">
            ここに本の詳細を表示します
          </div>
        </div>
      </section>
    </div>
  </body>
</html>

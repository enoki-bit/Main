<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>

    <div class="calculator">
        <div class="display" id="main_disp">0</div>        <input type="hidden" id="main_disp2" value="0">
        
        <div class="buttons">
            <button class="btn operator" id="btn_C">C</button>
            <button class="btn operator" id="btn_PM">＋/-</button>
            <button class="btn operator" id="btn_RAN">RAN</button>
            <button class="btn operator" id="btn_DIV">÷</button>
            
            <button class="btn" id="btn_7">7</button>
            <button class="btn" id="btn_8">8</button>
            <button class="btn" id="btn_9">9</button>
            <button class="btn operator" id="btn_BY">×</button>
            
            <button class="btn" id="btn_4">4</button>
            <button class="btn" id="btn_5">5</button>
            <button class="btn" id="btn_6">6</button>
            <button class="btn operator" id="btn_MIN">-</button>
            
            <button class="btn" id="btn_1">1</button>
            <button class="btn" id="btn_2">2</button>
            <button class="btn" id="btn_3">3</button>
            <button class="btn operator" id="btn_PLU">+</button>
            
            <button class="btn zero" id="btn_0">0</button>
            <button class="btn" id="btn_DOT">.</button>
            <button class="btn equal" id="btn_EQU">=</button>
            
            <button class="btn" id="btn_KRW">JPY</button>
            <button class="btn" id="btn_USD">USD</button>
            <button class="btn" id="btn_EUR">EUR</button>
            <button class="btn" id="btn_CNY">CNY</button>
        </div>
    </div>

</body>
</html>
